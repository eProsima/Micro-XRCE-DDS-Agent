name: CI Linux

on:
  pull_request:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      name:
        description: "Manual trigger"
  schedule:
    - cron: '55 17 * * 6'

permissions:
  pull-requests: write

jobs:
  build-test-style-cover:
    name: Build, Tests, and Coverage
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Install CMake and prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl python3-pip valgrind
          python3 -m pip install --upgrade pip
          python3 -m pip install gcovr

          # CMake 3.31.8
          CMAKE_VER=3.31.8
          curl -L "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VER}/cmake-${CMAKE_VER}-linux-x86_64.tar.gz" -o cmake-${CMAKE_VER}.tgz
          sudo tar -C /opt -xzf cmake-${CMAKE_VER}.tgz
          echo "/opt/cmake-${CMAKE_VER}-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Show cmake version
        run: |
          cmake --version
          ctest --version

      - name: Configure
        run: |
          mkdir -p build
          cd build
          COVERAGE_FLAGS="-fwrapv -fprofile-arcs -ftest-coverage --coverage -fno-inline -fno-inline-small-functions -fno-default-inline"
          cmake .. \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DUAGENT_BUILD_CI_TESTS=ON \
            -DGTEST_INDIVIDUAL=ON \
            -DCMAKE_C_FLAGS="${COVERAGE_FLAGS} -fprofile-abs-path" \
            -DCMAKE_CXX_FLAGS="${COVERAGE_FLAGS} -fprofile-abs-path" \
            -DCMAKE_EXE_LINKER_FLAGS="${COVERAGE_FLAGS}" \
            -DCMAKE_SHARED_LINKER_FLAGS="${COVERAGE_FLAGS}" \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/build/install"

      - name: Build
        run: |
          cd build
          make -j"$(nproc)"

      - name: Install
        run: |
          cd build
          cmake --install .

      # --- Run tests with newer CTest to produce JUnit ---
      - name: Run tests and export JUnit
        shell: bash
        run: |
          ctest --test-dir build \
            --output-on-failure \
            --no-tests=error \
            --output-junit "$GITHUB_WORKSPACE/build/CTestResults.xml"

      - name: Run memcheck
        shell: bash
        run: |
          ctest --test-dir build -VV -T MemCheck -E "test-case*"

      - name: Re-test under isolated install layout
        shell: bash
        run: |
          cd build
          cmake . -DUAGENT_ISOLATED_INSTALL=ON -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/build/install-isolated"
          cmake --install .
          ctest --output-on-failure --no-tests=error -R "test-case*"

      - name: Generate coverage (gcovr Cobertura XML + HTML)
        shell: bash
        run: |
          EXCLUDES=(
            '--exclude-unreachable-branches'
            '--exclude' 'build/'
            '--exclude' 'test/'
            '--exclude' 'examples/'
            '--exclude' 'thirdparty/'
            '--exclude' 'include/uxr/agent/transport/'
            '--exclude' 'src/cpp/transport/'
            '--exclude' 'src/cpp/types/XRCETypes.cpp'
            '--exclude' 'src/cpp/utils/ArgumentParser.cpp'
            '--exclude' 'include/uxr/agent/utils/ArgumentParser.hpp'
            '--exclude' 'microxrce_agent.cpp'
          )
          gcovr -x -r . "${EXCLUDES[@]}" -o build/coverage.xml
          gcovr --html-details -r . "${EXCLUDES[@]}" -o build/coverage.html
          gcovr -r . "${EXCLUDES[@]}" # human-readable summary

      - name: Upload artifacts (CTest & Coverage)
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage
          path: |
            build/CTestResults.xml
            build/coverage.xml
            build/coverage.html
          if-no-files-found: warn

      - name: Publish unit test results (JUnit)
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: (!cancelled())
        with:
          files: build/CTestResults.xml
          check_run: false
          comment_mode: failures
          comment_title: "Linux Tests Results"

  uncrustify:
    name: Uncrustify check
    runs-on: ubuntu-24.04
    if: ${{ !(github.event_name == 'pull_request') || !contains(github.event.pull_request.labels.*.name, 'conflicts') }}
    steps:
      - name: Run Uncrustify Linter
        uses: eProsima/eProsima-CI/ubuntu/uncrustify@v0
